const NOMI={A:'Geas Nera',B:'Geas Rossa'}, COL={A:'#1a1a1a',B:'#d7191c'};
const GG=['dom','lun','mar','mer','gio','ven','sab'], MESI=['GEN','FEB','MAR','APR','MAG','GIU','LUG','AGO','SET','OTT','NOV','DIC'];
const p2=n=>String(n).padStart(2,'0');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function parts(iso){const [y,m,d]=iso.split('-').map(Number);return {y,m,d,dow:GG[new Date(Date.UTC(y,m-1,d)).getUTCDay()]}}
const fmtData=iso=>{if(!iso)return 'data da definire';const t=parts(iso);return `${t.dow} ${p2(t.d)}/${p2(t.m)}/${t.y}`};
const fmtCorta=iso=>{if(!iso)return 'da definire';const t=parts(iso);return `${p2(t.d)}/${p2(t.m)}`};
const fmtWhen=m=>fmtData(m.data)+(m.ora?`, ore ${m.ora}`:'');

const map=L.map('map',{zoomControl:true});
const OSMA='&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';
const base={
 'OpenStreetMap':L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png',{maxZoom:19,attribution:OSMA+', tiles by FOSSGIS'}),
 'OpenTopoMap (rilievo)':L.tileLayer('https://tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:OSMA+', SRTM, style &copy; <a href="https://opentopomap.org">OpenTopoMap</a>'}),
 'Esri World Street Map':L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles &copy; Esri'})
};
base['OpenStreetMap'].addTo(map);
L.control.layers(base,null,{position:'bottomleft',collapsed:true}).addTo(map);

const layers={A:L.layerGroup().addTo(map),B:L.layerGroup().addTo(map)};
const isGeas=v=>v.squadra.startsWith('GEAS');
const awayMatch={}; M.filter(m=>!m.casa).forEach(m=>awayMatch[m.girone+'|'+m.sede]=m);
const markers={}; const bounds=[]; const vBy={}; V.forEach(v=>vBy[v.girone+'|'+v.squadra]=v);

function popAway(v,m){
  return `<div class="pop"><b>${esc(v.nome)}</b><br>${esc(v.impianto)}<br><small>${esc(v.indirizzo)}, ${esc(v.comune)}</small><hr>`+
   `<div class="when">${esc(fmtWhen(m))}</div><small>Giornata ${m.giornata}, gara n. ${m.gara}<br>Trasferta di ${NOMI[v.girone]}, girone ${v.girone}</small></div>`;
}
V.filter(v=>!isGeas(v)).forEach(v=>{
  const m=awayMatch[v.girone+'|'+v.squadra];
  const mk=L.circleMarker([v.lat,v.lon],{radius:9,color:'#fff',weight:2.5,fillColor:COL[v.girone],fillOpacity:1})
    .bindPopup(popAway(v,m)).bindTooltip(`${esc(v.nome)}, ${fmtCorta(m.data)}`,{direction:'top',offset:[0,-8]}).addTo(layers[v.girone]);
  markers[v.girone+'|'+v.squadra]=mk; bounds.push([v.lat,v.lon]);
});

const g=V.find(isGeas);
function homesHtml(k){
  return M.filter(m=>m.girone===k&&m.casa).map(m=>`<div>G${m.giornata}, ${fmtCorta(m.data)}${m.ora?' '+m.ora:''} <small>${esc(m.avv)}</small></div>`).join('');
}
const geasPop=`<div class="pop" style="min-width:400px"><b>GEAS VOLLEY NERA e ROSSA</b><br>${esc(g.impianto)}<br><small>${esc(g.indirizzo)}, ${esc(g.comune)}</small><hr><b>Gare in casa</b>`+
 `<div class="homes"><div><h4><span class="dot nera"></span>Nera</h4>${homesHtml('A')}</div><div><h4><span class="dot rossa"></span>Rossa</h4>${homesHtml('B')}</div></div></div>`;
const geasMk=L.marker([g.lat,g.lon],{icon:L.divIcon({className:'',html:'<div class="geas-icon"></div>',iconSize:[26,26],iconAnchor:[13,13]}),zIndexOffset:1000})
  .bindPopup(geasPop,{maxWidth:420}).bindTooltip('Palestra Geas',{direction:'top',offset:[0,-14]}).addTo(map);
bounds.push([g.lat,g.lon]);
map.fitBounds(bounds,{padding:[40,40]});

// pannello
const st={g:'A',f:'all'};
const today=new Date(); const todayIso=`${today.getFullYear()}-${p2(today.getMonth()+1)}-${p2(today.getDate())}`;
function render(){
  const rows=M.filter(m=>m.girone===st.g&&(st.f==='all'||(st.f==='T')===!m.casa)).sort((a,b)=>a.giornata-b.giornata);
  const nextIdx=rows.findIndex(m=>m.data&&m.data>=todayIso);
  document.getElementById('list').innerHTML=rows.map((m,i)=>{
    const t=m.data?parts(m.data):null;
    const dt=t?`<b>${p2(t.d)}</b><small>${MESI[t.m-1]}</small>`:`<b>?</b><small>DEF.</small>`;
    const sub=(m.casa?'In casa, Sesto San Giovanni':esc(vBy[m.girone+'|'+m.sede].comune))+` · G${m.giornata}`+(m.ora?` · ${m.ora}`:'')+(t?` · ${t.dow}`:'');
    return `<div class="r${i===nextIdx?' next':''}" data-k="${m.girone}|${m.giornata}"><span class="dt">${dt}</span><span class="t"><span class="opp">${esc(m.avv)}${i===nextIdx?'<span class="pill">prossima</span>':''}</span><small>${sub}</small></span><span class="tag ${m.casa?'c':'t'}">${m.casa?'Casa':'Trasf.'}</span></div>`;
  }).join('');
}
document.getElementById('list').addEventListener('click',e=>{
  const r=e.target.closest('.r'); if(!r)return;
  const [gi,gn]=r.dataset.k.split('|'); const m=M.find(x=>x.girone===gi&&x.giornata===+gn);
  if(m.casa){map.flyTo([g.lat,g.lon],14,{duration:.8});geasMk.openPopup();}
  else{const mk=markers[gi+'|'+m.sede];map.flyTo(mk.getLatLng(),13,{duration:.8});setTimeout(()=>mk.openPopup(),850);}
});
function seg(id,key){document.getElementById(id).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.toggle('on',x===b));st[key]=b.dataset.v;render();});}
seg('segG','g');seg('segF','f');render();
document.getElementById('nA').textContent=M.filter(m=>m.girone==='A'&&!m.casa).length+' trasferte';
document.getElementById('nB').textContent=M.filter(m=>m.girone==='B'&&!m.casa).length+' trasferte';
['A','B'].forEach(k=>document.getElementById('c'+k).addEventListener('change',e=>e.target.checked?layers[k].addTo(map):map.removeLayer(layers[k])));
const panel=document.getElementById('panel'),tog=document.getElementById('tog');
function setClosed(c){panel.classList.toggle('closed',c);tog.textContent=c?'Calendario':'Chiudi';}
tog.addEventListener('click',()=>setClosed(!panel.classList.contains('closed')));
if(window.innerWidth<700)setClosed(true);
</script></body></html>
