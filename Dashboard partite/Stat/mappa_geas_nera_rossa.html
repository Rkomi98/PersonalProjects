const base={

};
base['Mappa OpenStreetMap (CARTO)'].addTo(map);
L.control.layers(base,null,{position:'bottomleft',collapsed:true}).addTo(map);
const COL={A:'#111111',B:'#d7191c'};
const layers={A:L.layerGroup().addTo(map),B:L.layerGroup().addTo(map)};
const isGeas=d=>d.squadra.startsWith('GEAS');
const geas=DATA.filter(isGeas), others=DATA.filter(d=>!isGeas(d));
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function pop(d){return `<div class="pop"><b>${esc(d.squadra)}</b><br>${esc(d.impianto)}<br><small>${esc(d.indirizzo)}, ${esc(d.comune)}</small><br><small>Girone ${d.girone} (Geas ${d.colore})</small></div>`}
const bounds=[];
others.forEach(d=>{
  L.circleMarker([d.lat,d.lon],{radius:9,color:'#fff',weight:2.5,fillColor:COL[d.girone],fillOpacity:1}).bindPopup(pop(d)).bindTooltip(d.squadra.replace(/^A\.S\.D\. |^A\.S\.C\. /,''),{direction:'top',offset:[0,-8]}).addTo(layers[d.girone]);
  bounds.push([d.lat,d.lon]);
});
const g=geas[0];
L.marker([g.lat,g.lon],{icon:L.divIcon({className:'',html:'<div class="geas-icon"></div>',iconSize:[26,26],iconAnchor:[13,13]}),zIndexOffset:1000})
 .bindPopup(`<div class="pop"><b>GEAS VOLLEY NERA e ROSSA</b><br>${esc(g.impianto)}<br><small>${esc(g.indirizzo)}, ${esc(g.comune)}</small><br><small>Campo di casa di entrambe le squadre</small></div>`)
 .bindTooltip('Palestra Geas',{direction:'top',offset:[0,-14]}).addTo(map);

map.fitBounds(bounds,{padding:[40,40]});

document.getElementById('nB').textContent=others.filter(d=>d.girone==='B').length+' sedi in trasferta';
